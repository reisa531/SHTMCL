name: Package desktop

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Source version used by every platform
        value: ${{ jobs.check.outputs.version }}
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'apps/desktop/**'
      - 'crates/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'LICENSE'
      - 'tests/modules/10/**'
      - 'tests/packaging/**'
      - 'Cargo.*'
      - 'package.json'
      - 'pnpm-*.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/desktop/**'
      - 'crates/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'LICENSE'
      - 'tests/modules/10/**'
      - 'tests/packaging/**'
      - 'Cargo.*'
      - 'package.json'
      - 'pnpm-*.yaml'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check source and frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      aur-stable: ${{ steps.version.outputs.aur-stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: version
        name: Check shared version and release tag
        run: node scripts/release-version.mjs
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check packaging, contracts and icons
        run: |
          node --test tests/packaging/*.test.mjs
          node scripts/check-contract.mjs
          node scripts/gen-icons.mjs --check
          node scripts/check-codes.mjs
      - name: Typecheck and run frontend assertions
        run: |
          pnpm --filter @shtmcl/desktop typecheck
          node --input-type=module -e 'import {readdir} from "node:fs/promises"; for (const name of (await readdir("tests/modules/10")).filter(n => n.endsWith(".test.mjs")).sort()) await import("./tests/modules/10/" + name)'

  build:
    name: Package ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            arch: x86_64
            rust-targets: x86_64-pc-windows-msvc
          - platform: linux
            runner: ubuntu-22.04
            arch: x86_64
            rust-targets: x86_64-unknown-linux-gnu
          - platform: macos
            runner: macos-15
            arch: universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: package-${{ matrix.platform }}-${{ matrix.arch }}
          cache-on-failure: true
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test native core and desktop backend
        run: |
          # macOS /var is a system symlink; use its physical temporary path.
          if [[ "$RUNNER_OS" == macOS ]]; then
            export TMPDIR="$(cd "$TMPDIR" && pwd -P)"
          fi
          cargo test --locked --workspace --lib
      - name: Fetch Windows dependencies for the offline portable builder
        if: matrix.platform == 'windows'
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Build Windows portable EXE
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-portable-win.ps1
      - name: Build Linux AppImage and deb
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm exec tauri build --ci --target x86_64-unknown-linux-gnu --bundles appimage deb -- --locked
      - name: Build macOS universal app and DMG
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: pnpm exec tauri build --ci --target universal-apple-darwin --bundles app dmg -- --locked
      - name: Check macOS architectures and ad-hoc signature
        if: matrix.platform == 'macos'
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/SHTMCL.app
          lipo "$app/Contents/MacOS/SHTMCL" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
      - name: Collect packages, build metadata and SHA-256
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/package-artifacts.mjs "$RELEASE_PLATFORM"
      - name: Upload platform packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shtmcl-${{ needs.check.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  aur:
    name: Validate AUR recipe and Arch package
    needs: [check, build]
    if: needs.check.outputs.aur-stable == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch packaging tools and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git nodejs namcap \
            gtk3 webkit2gtk-4.1 hicolor-icon-theme
          useradd --create-home --user-group builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this run's Linux deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: shtmcl-${{ needs.check.outputs.version }}-linux-x86_64
          path: aur-input
      - name: Generate PKGBUILD and SRCINFO as an unprivileged user
        run: |
          mkdir -p target/aur
          chown builder:builder target/aur
          runuser -u builder -- node scripts/generate-aur.mjs
      - name: Build and lint the Arch package
        run: runuser -u builder -- bash scripts/build-aur.sh
      - name: Collect Arch package and AUR sources
        run: node scripts/package-artifacts.mjs aur
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shtmcl-${{ needs.check.outputs.version }}-aur-x86_64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
